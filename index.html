<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0c0700;
            font-family: Arial, sans-serif;
            color: #fff8e8;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .page { width: 100%; max-width: 600px; background: #1f1408; border: 1px solid rgba(225, 29, 42, 0.3); border-radius: 8px; padding: 20px; }
        .app-title { font-size: 32px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .app-desc { font-size: 12px; color: #b8a48a; margin-bottom: 20px; text-transform: uppercase; }
        .install-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #e11d2a, #f5c518);
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .live-comments { background: #160d04; padding: 15px; border-radius: 5px; border: 1px solid rgba(225, 29, 42, 0.2); }
        .comments-feed { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; font-size: 13px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .av { width: 24px; height: 24px; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="page">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://i.ibb.co/zCkQmLg/file-00000000bb4082088830b2ef26fde874.png" alt="Proxy Icon" style="width: 80px; height: 80px; border-radius: 10px;">
        </div>
        <div class="app-title">Proxy Server</div>
        <div class="app-desc">Unlimited Access · Low Ping · No Ban</div>
        
        <a href="https://fbwase.com/lottery?source=pb&sourceId=291574479738" target="_blank" class="install-btn">
            Get Proxy Server
        </a>

        <div class="live-comments">
            <div style="font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between;">
                <span>🔴 Live Comments</span>
                <span id="commentCount" style="font-size: 11px; color: #b8a48a;">865 watching</span>
            </div>
            <div class="comments-feed" id="chatList">
                <div class="row"><div class="av" style="background: rgb(255, 72, 176);"></div><div>Ravi · proxy server mil gaya</div></div>
                <div class="row"><div class="av" style="background: rgb(232, 93, 4);"></div><div>Karan · working 100% claimed proxy</div></div>
            </div>
        </div>
    </div>

    <script>
        const chatList = document.getElementById('chatList');
        const commentCountEl = document.getElementById('commentCount');
        const names = ['Ravi', 'Karan', 'Nikhil', 'Yash', 'Rahul', 'Amit', 'Vikram'];
        const comments = ['proxy server mil gaya', 'working 100% claimed proxy', 'low ping aa gaya', 'no ban proxy set hai'];
        const colors = ['rgb(255, 72, 176)', 'rgb(232, 93, 4)', 'rgb(45, 106, 79)', 'rgb(196, 165, 116)'];

        let watchingCount = 865;
        setInterval(() => {
            watchingCount += Math.floor(Math.random() * 5) - 2;
            if (commentCountEl) commentCountEl.textContent = watchingCount + ' watching';

            if (chatList) {
                const rName = names[Math.floor(Math.random() * names.length)];
                const rComment = comments[Math.floor(Math.random() * comments.length)];
                const rColor = colors[Math.floor(Math.random() * colors.length)];

                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `<div class="av" style="background: ${rColor};"></div><div>${rName} · ${rComment}</div>`;
                chatList.appendChild(row);

                if (chatList.children.length > 6) chatList.removeChild(chatList.firstElementChild);
                chatList.scrollTop = chatList.scrollHeight;
            }
        }, 2500);
    </script>
</body>
</html>
