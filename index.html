<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proxy Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0c0700;
            --surface: #160d04;
            --panel: #1f1408;
            --line: rgba(225, 29, 42, 0.22);
            --red: #e11d2a;
            --red-bright: #ff4d4d;
            --red-dim: rgba(225, 29, 42, 0.24);
            --green: #f5c518;
            --gold: #ffe566;
            --white: #fff8e8;
            --grey: #b8a48a;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Bebas Neue', sans-serif;
            --body: 'DM Sans', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            background: #0c0700;
            font-family: var(--body);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            max-width: 940px;
            margin: 0 auto;
            padding: 12px 24px 60px;
        }

        .block-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .block-num {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--red);
            letter-spacing: 1px;
        }

        .block-rule {
            height: 1px;
            background: var(--line);
        }

        .block-title {
            font-family: var(--display);
            font-size: 13px;
            letter-spacing: 5px;
            color: var(--grey);
            text-transform: uppercase;
        }

        .video-block { margin-bottom: 38px; }

        .video-frame {
            position: relative;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            border-top: 3px solid var(--red);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .video-frame video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .video-play-btn {
            position: absolute;
            inset: 0;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 10, 0.45);
            border: none;
            cursor: pointer;
        }

        .video-play-btn.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .video-play-btn .play-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--red), var(--green));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(225, 29, 42, 0.45);
        }

        .video-play-btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            margin-left: 3px;
        }

        .ticker-track {
            display: flex;
            gap: 50px;
            animation: ticker 42s linear infinite;
            white-space: nowrap;
            width: max-content;
        }
